# @generated by autocargo from //scm/dotslash/oss:[dotslash,dotslash_tests,parse_file]

[package]
name = "dotslash"
version = "0.5.9"
authors = ["Michael Bolin <bolinfest@gmail.com>", "Andres Suarez <zertosh@gmail.com>"]
edition = "2024"
rust-version = "1.85"
description = "Command-line tool to facilitate fetching an executable, caching it, and then running it."
readme = "README.md"
homepage = "https://dotslash-cli.com"
repository = "https://github.com/facebook/dotslash"
license = "MIT OR Apache-2.0"
keywords = ["cli"]
include = ["/LICENSE-APACHE", "/LICENSE-MIT", "/README.md", "/src/**", "/tests/**"]

[[bench]]
name = "parse_file"
harness = false

[dependencies]
anyhow = "1.0.104"
blake3 = { version = "=1.8.6", features = ["mmap", "rayon", "traits-preview"] }
bzip2 = "0.6.1"
dirs = "7.0"
dunce = "1.0.5"
filetime = "0.2.29"
flate2 = { version = "1.1.11", features = ["rust_backend"], default-features = false }
jsonc-parser = { version = "0.26", features = ["serde"] }
liblzma = { version = "0.4.9", features = ["parallel", "static"] }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.154"
sha2 = "0.10.6"
tar = "0.4.46"
tempfile = "3.27.0"
thiserror = "2.0.21"
zip = { version = "9.4.1", features = ["deflate"], default-features = false }
zstd = { version = "0.14.3", features = ["experimental", "zstdmt"] }

[dev-dependencies]
assert_matches = "1.5"
buck-resources = "1"
criterion = "0.8.2"
snapbox = { version = "0.6.24", features = ["color-auto", "diff", "json", "regex"], default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.31.3", features = ["dir", "event", "hostname", "inotify", "ioctl", "mman", "mount", "net", "poll", "ptrace", "reboot", "resource", "sched", "signal", "term", "time", "user", "zerocopy"] }

[target.'cfg(target_os = "macos")'.dependencies]
nix = { version = "0.31.3", features = ["dir", "event", "hostname", "inotify", "ioctl", "mman", "mount", "net", "poll", "ptrace", "reboot", "resource", "sched", "signal", "term", "time", "user", "zerocopy"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

[lints.clippy]
nursery = { level = "warn", priority = -2 }
pedantic = { level = "warn", priority = -2 }
allow_attributes = { level = "warn", priority = -1 }
bool_assert_comparison = { level = "allow", priority = -1 }
cast_lossless = { level = "allow", priority = -1 }
cast_possible_truncation = { level = "allow", priority = -1 }
cast_precision_loss = { level = "allow", priority = -1 }
cast_sign_loss = { level = "allow", priority = -1 }
cognitive_complexity = { level = "allow", priority = -1 }
derive_partial_eq_without_eq = { level = "allow", priority = -1 }
doc_markdown = { level = "allow", priority = -1 }
manual_string_new = { level = "allow", priority = -1 }
missing_const_for_fn = { level = "allow", priority = -1 }
missing_errors_doc = { level = "allow", priority = -1 }
missing_panics_doc = { level = "allow", priority = -1 }
module_name_repetitions = { level = "allow", priority = -1 }
no_effect_underscore_binding = { level = "allow", priority = -1 }
option_if_let_else = { level = "allow", priority = -1 }
struct_excessive_bools = { level = "allow", priority = -1 }
struct_field_names = { level = "allow", priority = -1 }
too_many_lines = { level = "allow", priority = -1 }
uninlined_format_args = { level = "allow", priority = -1 }
unreadable_literal = { level = "allow", priority = -1 }
use_self = { level = "allow", priority = -1 }

[lints.rust]
rust_2018_idioms = { level = "warn", priority = -2 }
unexpected_cfgs = { level = "warn", priority = 0, check-cfg = ["cfg(fbcode_build)", "cfg(dotslash_internal)"]}
